<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070F" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2305070F'/%3E%3Cpath d='M16 16c-6-9-12-4-9 2s7 3 9-2zm0 0c6-9 12-4 9 2s-7 3-9-2z' fill='%23F5C76A'/%3E%3C/svg%3E" />
    <title>Aurea</title>
  </head>
  <body>
    <!-- background: static gradient + a few CSS-twinkling stars -->
    <div id="starfield" class="starfield" aria-hidden="true"></div>
    <!-- one-shot dim layer used by the butterfly guide -->
    <div id="dim" class="dim" aria-hidden="true"></div>

    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-name">Aurea</span>
          <span class="brand-local" data-i18n="brand.local"></span>
          <span class="brand-tag" data-i18n="brand.tagline"></span>
        </div>
        <div class="lang" role="group" data-i18n-attr="aria-label:lang.label">
          <button type="button" data-lang="zh" lang="zh" aria-pressed="true" data-i18n-attr="aria-label:lang.zh" title="中文">中</button>
          <button type="button" data-lang="en" lang="en" aria-pressed="false" data-i18n-attr="aria-label:lang.en" title="English">EN</button>
          <button type="button" data-lang="ja" lang="ja" aria-pressed="false" data-i18n-attr="aria-label:lang.ja" title="日本語">日</button>
        </div>
      </header>

      <main class="stage" id="stage">
        <!-- home: ring + capsule area -->
        <section class="home" id="home">
          <h1 class="home-title" id="home-title" tabindex="-1" data-i18n="home.title"></h1>
          <div class="ring" id="ring" aria-hidden="true"></div>
          <p class="home-hint" data-i18n="home.hint"></p>
          <div class="center-zone" id="center" role="group"></div>
        </section>

        <!-- page card + follow-up capsules -->
        <div class="page-wrap" id="page-wrap" hidden>
          <article class="card page-card" id="page-card" role="region">
            <button type="button" class="icon-btn card-close" id="page-close" data-i18n-attr="aria-label:page.close" title="Esc">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
            </button>
            <div class="card-scroll" id="page-scroll"><div id="page-body"></div></div>
          </article>
          <nav class="followups" id="followups"></nav>
        </div>

        <!-- screen-reader announcements -->
        <p class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></p>
      </main>

      <div class="scrim" id="scrim" hidden></div>

      <!-- wheel (contents are built by src/app/wheel.ts) -->
      <div class="wheel" id="wheel" role="dialog" aria-modal="true" aria-labelledby="wheel-title" hidden>
        <h2 class="sr-only" id="wheel-title"></h2>
        <div class="wheel-dial">
          <div id="wheel-svg-host"></div>
          <button type="button" class="wheel-close" id="wheel-close">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          </button>
          <span class="wheel-rim" id="wheel-rim" aria-hidden="true"></span>
        </div>
        <p class="wheel-hint" id="wheel-hint"></p>
      </div>

      <!-- tutorial drawer -->
      <aside class="tutorial" id="tutorial" role="dialog" aria-modal="false" aria-labelledby="tut-title" hidden>
        <header class="tut-head">
          <h2 id="tut-title" tabindex="-1"></h2>
          <button type="button" class="icon-btn" id="tut-close">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          </button>
        </header>
        <p class="tut-intro" id="tut-intro"></p>
        <ol class="tut-steps" id="tut-steps"></ol>
        <footer class="tut-foot"><span id="tut-progress"></span><i class="tut-bar" aria-hidden="true"></i></footer>
      </aside>

      <div class="toast" id="toast" aria-hidden="true"></div>

      <!-- command bar: mic | input | wheel | tutorial (exactly two buttons right of the input) -->
      <footer class="cmdbar" id="cmdbar">
        <div class="cmd-pill">
          <button type="button" class="cmd-btn cmd-mic" id="btn-mic" aria-pressed="false" data-i18n-attr="aria-label:mic.label">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          </button>
          <div class="input-wrap">
            <input id="cmd-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" data-i18n-attr="placeholder:cmd.placeholder;aria-label:cmd.label" />
            <div class="voice" id="voice" hidden aria-hidden="true">
              <span class="voice-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
              <span class="voice-label" id="voice-label"></span>
            </div>
          </div>
          <button type="button" class="cmd-btn cmd-action" id="btn-wheel" aria-expanded="false" data-i18n-attr="aria-label:wheel.btnLabel">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8" /><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M12 3.5v6M12 14.5v6M4.6 8l5.2 3M14.2 13l5.2 3M4.6 16l5.2-3M14.2 11l5.2-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".7" /></svg>
            <span class="cmd-text" data-i18n="wheel.btn"></span>
          </button>
          <button type="button" class="cmd-btn cmd-action" id="btn-tutorial" aria-expanded="false" data-i18n-attr="aria-label:tutorial.btnLabel">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M9.6 9.4a2.5 2.5 0 114 2c-.9.7-1.6 1.1-1.6 2.3M12 16.8v.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            <span class="cmd-text" data-i18n="tutorial.btn"></span>
          </button>
        </div>
      </footer>
    </div>

    <!-- the butterfly lives here (created by src/butterfly) -->
    <div id="butterfly-layer" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
